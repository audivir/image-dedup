[package]
name = "image_dedup"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for finding and removing duplicate images and videos, and sorting media, built on czkawka_core."

[dependencies]
clap = { version = "4.5", features = ["color", "derive"] }

crossbeam-channel = { version = "0.5", features = [] }
ctrlc = { version = "3.4", features = ["termination"] }
czkawka_core = { path = "vendor/czkawka/czkawka_core", version = "11" }
humansize = "2.1"
indicatif = "0.18"
log = "0.4.22"

anyhow = "1.0"
crossterm = "0.29"
image = "0.25.10"
ratatui = "0.30"
ratatui-image = {
  version = "11.0",
  default-features = false,
  features = [
    "image-defaults",
    "crossterm",
  ]
}
rayon = "1.12"

[features]
default = []
heif = ["czkawka_core/heif"]
no_colors = []

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
